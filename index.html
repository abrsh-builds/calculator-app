<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Chicle&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="title">simple calculator</h1>
      <h2>
        Keyboard input is supported. you can use <br />
        "Enter" key for "=" button <br />
        "Backspace" key for "⌫" button<br />
        "ESC" key for "AC" button<br />
        "%" key for percentage <br />
        "Tab" key for sign toggle.
      </h2>
      <div class="display">
        <h1 class="display-txt">0</h1>
      </div>
      <div class="calculator">
        <button class="plus operator">+</button>
        <button class="minus operator">-</button>
        <button class="times operator">x</button>
        <button class="divide operator">÷</button>

        <button class="item seven">7</button>
        <button class="item eight">8</button>
        <button class="item nine">9</button>

        <button class="backspace">⌫</button>
        <button class="item four">4</button>
        <button class="item five">5</button>
        <button class="item six">6</button>
        <button class="toggle-sign">±</button>
        <button class="item one">1</button>
        <button class="item two">2</button>
        <button class="item three">3</button>
        <button class="percent">%</button>

        <button class="item zero">0</button>

        <button class="item decimal-pt">.</button>
        <button class="clear">AC</button>
        <button class="equals">=</button>
        <button class="item sqrt">√</button>
      </div>

      <footer>Made by Abreham</footer>
    </div>

    <script src="index.js" charset="UTF-8"></script>
  </body>
</html>
